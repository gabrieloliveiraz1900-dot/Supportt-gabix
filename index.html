<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrendamento jovem: o papel do Estado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#0f1c2e;--ink:#f5f1e8;--mut:#b9c5d4;--gold:#e3b04b;--card:rgba(255,255,255,.07);--line:rgba(245,241,232,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{font-size:clamp(12px,min(1.55vw,2.5vh),26px);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;perspective:900px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#1d3552 0%,var(--bg) 70%)}
#world{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.ring{position:absolute;left:50%;top:50%;width:62vw;height:35vw;margin:-17.5vw 0 0 -31vw;border:1px solid var(--gold);border-radius:.6rem;transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity 1s}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(10,18,30,.75))}
#deck{position:fixed;inset:0;perspective:1400px}
#stage{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
.s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2.2rem 2.5rem 4.2rem;opacity:0;pointer-events:none;transform:translateZ(-1300px);transition:transform .95s cubic-bezier(.2,.7,.2,1),opacity .7s;transform-style:preserve-3d}
.s.past{transform:translateZ(800px) scale(1.04)}
.s.on{opacity:1;transform:none;pointer-events:auto}
.p{width:100%;max-width:62rem;max-height:100%;overflow:auto;padding:.4rem;scrollbar-width:none}
.r{opacity:0;transform:translateY(1.6rem) translateZ(70px);transition:opacity .7s,transform .8s cubic-bezier(.2,.7,.2,1)}
.s.on .r{opacity:1;transform:none;transition-delay:calc(var(--i)*90ms + 300ms)}
h1,h2{font-family:"EB Garamond",Georgia,serif;font-weight:500;line-height:1.08;margin:0 0 1.4rem}
h1{font-size:4.2rem;max-width:52rem}h2{font-size:2.8rem}
h3{font-family:"EB Garamond",Georgia,serif;font-size:1.45rem;font-weight:600;margin:.2rem 0 .4rem;color:var(--ink)}
p{margin:0}
.k{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;font-weight:600;margin-bottom:1.1rem}
.lead{font-size:1.5rem;line-height:1.45;color:var(--mut);max-width:42rem}
.foot{margin-top:2.2rem;color:var(--gold);font-size:1.05rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.3rem 1.4rem;backdrop-filter:blur(6px)}
.card p{color:var(--mut);line-height:1.5;font-size:1rem}
.tag{color:var(--gold);font-family:"EB Garamond",serif;font-size:1.9rem;line-height:1}
.tag.t{font:600 .75rem "Public Sans";letter-spacing:.14em;text-transform:uppercase}
.call{margin-top:1.2rem;background:var(--gold);color:#16263b;border-radius:1rem;padding:1.1rem 1.5rem;font-weight:600;font-size:1.15rem;line-height:1.4}
.src{margin-top:1.1rem;color:#8d9db0;font-size:.8rem}
.big{font-family:"EB Garamond",serif;color:var(--gold);font-size:6rem;line-height:1;font-weight:500}
.row{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line);line-height:1.4}
.row b{color:var(--gold);font-weight:600}.row span{color:var(--mut)}
.cmp div{font-size:.95rem;line-height:1.4;color:var(--mut);margin-top:.4rem}.cmp em{font-style:normal;color:var(--gold);font-weight:600;margin-right:.4rem}
.num{font-family:"EB Garamond",serif;font-size:3.4rem;color:var(--gold);line-height:1}
ul{margin:0;padding-left:1.2rem;color:var(--mut);line-height:1.8}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem calc(.7rem + env(safe-area-inset-bottom,0px));font-size:.8rem}
#ui button{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem;font:inherit;cursor:pointer}
#ui button:hover{background:rgba(255,255,255,.2)}

#dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line);cursor:pointer;transition:.3s}
#dots i.on{background:var(--gold);transform:scale(1.5)}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:var(--gold);z-index:9;transition:width .8s}
@media(max-width:700px){h1{font-size:2.8rem}h2{font-size:2.1rem}.row{grid-template-columns:1fr;gap:.2rem}.big{font-size:4.5rem}.s{padding:1.5rem 1rem 4.5rem}#tl{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
#intro{position:fixed;inset:0;z-index:99;background:radial-gradient(ellipse at 50% 75%,#1d3552 0%,#050b14 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;text-align:center;padding:1rem 1rem 9vh;overflow:hidden;transition:opacity 1.1s .5s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#sky{position:absolute;left:0;right:0;bottom:0;height:34vh;display:flex;align-items:flex-end;justify-content:center;gap:.35rem;opacity:.9}
.bd{display:flex;flex-wrap:wrap;align-content:flex-start;gap:.3rem;padding:.5rem .35rem;width:clamp(2.6rem,7vw,5.2rem);background:rgba(255,255,255,.045);border-top:1px solid rgba(227,176,75,.35)}
.bd i{width:calc(33% - .2rem);aspect-ratio:1;background:rgba(255,255,255,.06);transition:background 1s,box-shadow 1s}
.bd i.l{background:var(--gold);box-shadow:0 0 .5rem rgba(227,176,75,.7)}
#hd{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1rem;transition:opacity .6s}
#tt{font-family:"EB Garamond",Georgia,serif;font-weight:500;font-size:min(8.4vw,5.2rem);line-height:1.05;max-width:90vw;min-height:1.1em;background:linear-gradient(180deg,#fff 25%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1.4rem rgba(227,176,75,.4))}
#cr{display:inline-block;width:.05em;height:.8em;margin-left:.06em;background:var(--gold);vertical-align:-.05em;animation:bl .8s steps(1) infinite;-webkit-text-fill-color:initial;opacity:0}
#cr.on{opacity:1}
@keyframes bl{50%{opacity:0}}
#go0{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--gold);color:#16263b;border:0;border-radius:999px;padding:1rem 2.4rem;font:600 1.2rem "Public Sans";cursor:pointer;box-shadow:0 0 0 0 rgba(227,176,75,.6);animation:pu 1.6s infinite}
@keyframes pu{to{box-shadow:0 0 0 1.6rem rgba(227,176,75,0)}}
#cap{color:var(--gold);letter-spacing:.4em;text-transform:uppercase;font-size:.95rem;font-weight:600;opacity:0;transform:translateY(.6rem);transition:opacity 1s,transform 1s}
#cap.show{opacity:1;transform:none}
#dw{position:relative;z-index:1;margin-top:.6rem;transform-origin:50% 60%;transition:transform 1.9s cubic-bezier(.7,0,.3,1),opacity .4s 1.5s}
#pl{display:block;font:600 .9rem "Public Sans";letter-spacing:.2em;color:var(--gold);margin-bottom:.5rem;opacity:.85}
#fr{position:relative;width:7.5rem;height:11.5rem;margin:0 auto;border:.3rem solid var(--gold);border-bottom:0;border-radius:3.8rem 3.8rem 0 0;perspective:700px;background:#050b14;opacity:0;transition:opacity 1s .6s}
#fr.show{opacity:1}
#lt{position:absolute;inset:0;border-radius:3.5rem 3.5rem 0 0;background:radial-gradient(circle at 50% 85%,#fff6d8 0%,#f4cf7a 35%,#b87d1c 100%);box-shadow:0 0 3rem 1rem rgba(227,176,75,.5)}
#dr{position:absolute;inset:0;border-radius:3.5rem 3.5rem 0 0;background:linear-gradient(90deg,#2b4a69,#1b3149);transform-origin:left center;transition:transform 1.7s cubic-bezier(.6,0,.2,1)}
#dr i{position:absolute;right:.9rem;top:55%;width:.55rem;height:.55rem;border-radius:50%;background:var(--gold)}
#intro.open #dr{transform:rotateY(-105deg)}
#intro.out #dw{transform:scale(22)}
#intro.out #hd,#intro.out #sky{opacity:0;transition:opacity .7s}
#sk{position:absolute;z-index:2;right:1.2rem;top:calc(1rem + env(safe-area-inset-top,0px));background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:.4rem .9rem;font:inherit;font-size:.8rem;cursor:pointer}
</style>
</head>

<div id="bar"></div>
<div id="intro"><div id="sky"></div><div id="hd"><div id="tt"><span id="ty"></span><b id="cr"></b></div><div id="cap">O papel do Estado</div></div><div id="dw"><span id="pl">PORTA 65</span><div id="fr"><div id="lt"></div><div id="dr"><i></i></div></div></div><button id="go0">▶ Começar</button><button id="sk">Saltar intro</button></div>

<script>

{c:'cards',t:'Porque intervém o Estado na habitação',i:[['01','Direito constitucional','O artigo 65.º da Constituição garante a todos o direito a uma habitação adequada.'],['02','Dever do Estado','Cabe ao Estado desenvolver uma política de habitação e procurar rendas compatíveis com o rendimento das famílias.'],['03','Jovens em dificuldade','Os jovens estão entre os que mais dificuldade têm em arrendar casa, com salários baixos e rendas altas.']],o:'O Estado cria regras e apoios para que arrendar seja possível.'},
{c:'table',t:'As leis que enquadram o arrendamento jovem',i:[['CRP, art. 65.º','Constituição: direito à habitação e dever do Estado'],['Lei 83/2019','Lei de Bases da Habitação: direitos e deveres de todos'],['Lei 6/2006','NRAU: regras dos contratos de arrendamento urbano'],['DL 308/2007','Cria o programa Porta 65 – Arrendamento por Jovens'],['Lei 56/2023','Mais Habitação: medidas para a crise, incluindo o Porta 65'],['DL 42/2024','Novas regras do Porta 65, em vigor desde setembro de 2024']],r:'Fonte: Diário da República e gov.pt'},
{c:'hero',t:'Porta 65 Jovem: o principal apoio',b:'30–50%',l:'da renda paga pelo Estado no primeiro ano',i:[['Quem','Jovens dos 18 aos 35 anos (em casal, um pode ter até 37)'],['Durante quanto tempo','12 meses, renovável até 60 meses (5 anos)'],['Quem gere','IHRU, o Instituto da Habitação e da Reabilitação Urbana'],['Regra','Não se acumula com outro apoio público à habitação']],r:'Fonte: gov.pt, Montepio, Literacia Financeira (2026)'},
{c:'cmp',t:'O que mudou em setembro de 2024',i:[['Contrato de arrendamento','Era preciso apresentar um contrato logo na candidatura.','A candidatura faz-se sem contrato, que só é exigido se for aprovada.'],['Valor da renda','Rendas acima dos limites do programa excluíam o jovem.','O valor da renda deixa de ser um fator de exclusão.']],o:'Meta do Governo: passar de 28 mil jovens apoiados em 2023 para 40 mil em 2024.',r:'Fonte: ECO (2 set. 2024), Idealista'},
{c:'stats',t:'O Porta 65 em números',i:[['28 133','jovens apoiados em 2023'],['45 600+','jovens apoiados até setembro de 2025'],['275 €','apoio médio por mês em 2026']],o:'O número de jovens apoiados subiu depois das novas regras de 2024.',r:'Fonte: Idealista, ComparaJá (dados do debate do OE 2026)'},
{c:'cards',t:'Outras medidas do Estado',i:[['Arrendar','Porta 65+','Sem limite de idade, para quem perdeu rendimentos e para famílias monoparentais. Não se acumula com o Porta 65 Jovem.'],['Arrendar','Arrendamento Acessível','Contratos com rendas abaixo do mercado. Quem tem um destes contratos pode pedir também o Porta 65 Jovem.'],['Comprar','Primeira casa até aos 35','Isenção de IMT e Imposto do Selo até 330.539 € em 2026 e garantia pública de até 15% do crédito, em contratos até final de 2026.']],tg:1,r:'Fonte: ComparaJá, ECO, DN, Montepio (2026)'},
{c:'cards',t:'O contrato de arrendamento: o essencial',i:[['01','Por escrito','O arrendamento para habitação deve ter contrato escrito, segundo o NRAU.'],['02','Casa habitável','A casa tem de cumprir condições mínimas de habitabilidade.'],['03','Comunicado às Finanças','O contrato é comunicado à Autoridade Tributária, o que também ajuda a candidatura a apoios.']],r:'Fonte: Lei 6/2006 (NRAU), Ativos.pt, Uniplaces'},

{c:'cards',t:'Conclusão',i:[['1','','O Estado reconhece a habitação como um direito e apoia diretamente o arrendamento jovem.'],['2','','O Porta 65 Jovem é o principal instrumento e ficou mais simples em 2024.'],['3','','Os apoios ajudam a pagar a renda, mas os preços e a falta de casas continuam a ser o grande desafio.']],o:'A nossa opinião: os apoios do Estado ajudam muito, mas não chegam sozinhos. Para os jovens conseguirem mesmo arrendar casa, também é preciso haver mais casas e rendas mais baixas.'},
{c:'list',t:'Fontes',i:['gov.pt: Candidatar-se ao Porta 65 Jovem','ECO: Porta 65 tem novas regras (2 de setembro de 2024)','ECO: Rendas, crédito e impostos. Tudo o que muda na habitação em 2026','Idealista: Porta 65 Jovem, valor da renda deixa de ser fator de exclusão','Montepio: Porta 65 Jovem, como candidatar-se em 2026','ComparaJá: Apoios ao arrendamento jovem em 2026','Literacia Financeira: Porta 65 Jovem e Porta 65+ em 2026','Diário de Notícias: Lei da habitação, todas as mexidas anunciadas pelo Governo','Diário da República: Decreto-Lei 308/2007 e Portaria 277-A/2010'],r:'Consultadas em novembro de 2026'}
];
const $=s=>document.querySelector(s),R=(c,h)=>`<div class="r ${c}">${h}</div>`;
function body(d){const T=R('','<h2>'+d.t+'</h2>').replace('class="r "','class="r"');let h='';
 const o=d.o?R('call',d.o):'',src=d.r?R('src',d.r):'';
 if(d.c=='cover')return R('k',d.k)+`<h1 class="r">${d.t}</h1>`+R('lead',d.s)+R('foot',d.f);
 if(d.c=='cards')h=`<div class="g">`+d.i.map(x=>R('card',(x[0]&&(d.tg?`<div class="tag t">${x[0]}</div>`:`<div class="tag">${x[0]}</div>`))+(x[1]?`<h3>${x[1]}</h3>`:'')+`<p>${x[2]}</p>`)).join('')+'</div>';
 if(d.c=='table')h=d.i.map(x=>R('row',`<b>${x[0]}</b><span>${x[1]}</span>`)).join('');
 if(d.c=='hero')h=`<div class="g" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:center">`+R('',`<div class="big">${d.b}</div><p class="lead" style="font-size:1.2rem">${d.l}</p>`)+`<div>`+d.i.map(x=>R('row',`<b>${x[0]}</b><span>${x[1]}</span>`)).join('')+`</div></div>`;
 if(d.c=='cmp')h=`<div class="g">`+d.i.map(x=>R('card cmp',`<h3>${x[0]}</h3><div><em>Antes</em>${x[1]}</div><div style="color:var(--ink)"><em>Agora</em>${x[2]}</div>`)).join('')+'</div>';
 if(d.c=='stats')h=`<div class="g">`+d.i.map(x=>R('card',`<div class="num">${x[0]}</div><p>${x[1]}</p>`)).join('')+'</div>';

const st=$('#stage'),wd=$('#world'),dots=$('#dots'),S=[],K=14;let i=0,tilt=true;
D.forEach((d,n)=>{const e=document.createElement('section');e.className='s';e.innerHTML=`<div class="p">${body(d)}</div>`;e.querySelectorAll('.r').forEach((x,j)=>x.style.setProperty('--i',j));st.append(e);S.push(e);const b=document.createElement('i');b.onclick=()=>go(n);dots.append(b)});
const rings=[];for(let k=0;k<K;k++){const r=document.createElement('div');r.className='ring';wd.append(r);rings.push(r)}
function go(n){n=Math.max(0,Math.min(D.length-1,n));i=n;
 S.forEach((e,j)=>e.className='s'+(j==n?' on':j<n?' past':''));

$('#pv').onclick=()=>go(i-1);$('#nx').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}else if(e.key=='Home')go(0);else if(e.key=='End')go(D.length-1)});

const sky=$('#sky'),ty=$('#ty'),cr=$('#cr');let fin=false,started=false,ac=null,mg=null,tm=[];

function audio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();mg=ac.createGain();mg.gain.value=0;mg.gain.linearRampToValueAtTime(.55,ac.currentTime+3);
const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.connect(mg);mg.connect(ac.destination);
const C=[[220,261.63,329.63],[174.61,220,261.63],[130.81,196,261.63],[196,246.94,293.66],[220,261.63,329.63]];

const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ch[0]/2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+1.4);g.gain.linearRampToValueAtTime(0,t+4.4);o.connect(g);g.connect(lp);o.start(t);o.stop(t+4.5)})}catch(e){ac=null}}
function key(v){if(!ac)return;const t=ac.currentTime,n=Math.floor(ac.sampleRate*.04),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);

const o=ac.createOscillator(),h=ac.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(60,t+.05);h.gain.setValueAtTime(.18,t);h.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(h);h.connect(ac.destination);o.start(t);o.stop(t+.07)}
function ding(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1760;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.7)}
function whoosh(){if(!ac)return;const t=ac.currentTime,n=Math.floor(ac.sampleRate*1.8),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2400,t+1.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.8);g.gain.linearRampToValueAtTime(0,t+1.8);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
